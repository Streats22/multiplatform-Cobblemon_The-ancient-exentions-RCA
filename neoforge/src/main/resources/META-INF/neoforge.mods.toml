modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "ancient_extensions"
version = "${version}"
displayName = "The Ancient Extensions"
authors = "Streats1"
description = '''
Rubius Cobblemon glue mod: Ancient Professor's Field Kit, Regional Survey (custom dex rewards),
seasonal migration hooks, passport/journal/pouch. Requires Cobblemon 1.7.x.
Recommends Regions Unexplored for migration biome routes and spawn pools.
'''
displayURL = "https://modrinth.com/modpack/rubius-cobblemon"

[[dependencies.ancient_extensions]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ancient_extensions]]
modId = "neoforge"
mandatory = true
versionRange = "[21.1.182,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ancient_extensions]]
modId = "cobblemon"
mandatory = true
versionRange = "[1.7.3,1.8.0)"
ordering = "AFTER"
side = "BOTH"

# Migration routes + spawn pools reference RU biomes; mod still runs without it (vanilla biomes count too).
[[dependencies.ancient_extensions]]
modId = "regions_unexplored"
mandatory = false
versionRange = "[0.5.6,)"
ordering = "NONE"
side = "BOTH"
